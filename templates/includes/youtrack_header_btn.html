{% comment %}
Индикатор состояния YouTrack в шапке. Отдельный фрагмент: модальное окно
токена возвращает его же OOB-свопом, чтобы состояние менялось сразу после
сохранения.
{% endcomment %}
<button type="button"
        id="youtrack-header-btn"
        class="header-tool {% if request.user.youtrack_token %}is-ok{% else %}is-alert{% endif %}"
        data-bs-toggle="modal"
        data-bs-target="#userTokenModal"
        hx-get="{% url 'users:profile_youtrack_token' %}"
        hx-target="#user-token-modal-content"
        title="{% if request.user.youtrack_token %}Токен YouTrack настроен — нажмите, чтобы изменить{% else %}Токен YouTrack не настроен — нажмите, чтобы указать{% endif %}"
        aria-label="Персональный токен YouTrack"
        {% if oob %}hx-swap-oob="outerHTML"{% endif %}>
    <i class="bi bi-hdd-network"></i>
    <span class="d-none d-xl-inline">YouTrack</span>
</button>
