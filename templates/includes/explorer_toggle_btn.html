{% comment %}
Кнопка переключения режима справочника (дерево ↔ проводник).
Отдельный фрагмент, потому что представление возвращает её же после
переключения — разметка должна существовать в одном экземпляре.
{% endcomment %}
<button type="button"
        id="explorer-toggle-btn"
        class="header-nav-btn"
        hx-post="{% url 'toggle_explorer_mode' %}"
        hx-target="#explorer-toggle-btn"
        hx-swap="outerHTML"
        title="Режим справочника: {% if explorer_mode == 'flat' %}проводник — нажмите, чтобы вернуться к дереву{% else %}дерево — нажмите, чтобы перейти к проводнику{% endif %}"
        aria-label="Переключить режим справочника">
    <i class="bi {% if explorer_mode == 'flat' %}bi-folder2-open text-warning{% else %}bi-diagram-3-fill text-info{% endif %} fs-6"></i>
</button>
