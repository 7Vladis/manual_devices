<header class="app-header sticky-top d-flex align-items-center">
    <div class="container-fluid px-3 d-flex align-items-center gap-3 w-100">

        <!-- Разделы. Подписи рядом с иконками: разделов три, и угадывать их
             по пиктограмме приходилось каждый раз заново. -->
        <nav class="header-nav">
            <a class="header-nav-btn {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
               href="{% url 'dashboard' %}">
                <i class="bi bi-calendar-check"></i>
                <span class="d-none d-lg-inline">План ТО</span>
            </a>

            <a class="header-nav-btn {% if request.resolver_match.url_name == 'dict' %}active{% endif %}"
               href="{% url 'dict' %}">
                <i class="bi bi-box-seam"></i>
                <span class="d-none d-lg-inline">Справочник</span>
            </a>

            {% if not request.user.is_junior %}
            <a class="header-nav-btn {% if request.resolver_match.url_name == 'settings_page' %}active{% endif %}"
               href="{% url 'settings_page' %}">
                <i class="bi bi-sliders"></i>
                <span class="d-none d-lg-inline">Настройки</span>
            </a>
            {% endif %}
        </nav>

        <!-- Поиск занимает свободное место между навигацией и тулбаром -->
        <div class="header-search ms-auto">
            <i class="bi bi-search header-search-icon"></i>
            <input type="text"
                   name="q"
                   class="form-control shadow-none"
                   placeholder="Название, инв. №, модель, задача YouTrack"
                   aria-label="Поиск по справочнику"
                   hx-get="{% url 'search' %}"
                   hx-trigger="keyup changed delay:350ms"
                   hx-target="#search-results"
                   autocomplete="off"
                   onkeydown="if(event.key==='Escape'){ this.value=''; document.getElementById('search-results').innerHTML=''; }">
            <div id="search-results" class="position-absolute w-100" style="z-index: 1060;"></div>
        </div>

        <div class="d-flex align-items-center gap-2 ms-auto">

            {% if request.user.is_admin_or_higher %}
            <button type="button"
                    class="header-tool"
                    data-bs-toggle="modal"
                    data-bs-target="#exportModal"
                    title="Выгрузить справочник в XLSX">
                <i class="bi bi-download"></i>
                <span class="d-none d-xl-inline">Выгрузить</span>
            </button>
            {% endif %}

            <!-- Токен YouTrack настраивается здесь и только здесь -->
            {% include 'includes/youtrack_header_btn.html' %}

            <!-- Кто вошёл. Без меню: внутри было бы только то, что уже есть рядом. -->
            <span class="header-user" title="{{ user.email }} — {{ user.get_role_display }}">
                <span class="avatar">{{ user.email|slice:":2"|upper }}</span>
                <span class="d-none d-md-inline text-truncate" style="max-width: 130px;">{{ user.username|default:user.email }}</span>
            </span>

            <form action="{% url 'logout' %}" method="post" class="m-0">
                {% csrf_token %}
                <button type="submit" class="header-tool is-square" title="Выйти из системы" aria-label="Выйти">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </form>

        </div>

    </div>
</header>
