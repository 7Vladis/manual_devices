<header class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm" style="background-color: #1e293b;">
    <div class="container-fluid px-4">
        
        <!-- Навигация -->
        <div class="d-flex align-items-center nav-buttons-group">
            <a class="btn btn-outline-light me-2 nav-btn {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">
                <i class="bi bi-grid-fill me-1"></i> Главная
            </a>
            <a class="btn btn-outline-light nav-btn {% if request.resolver_match.url_name == 'dict' %}active{% endif %}" href="{% url 'dict' %}">
                <i class="bi bi-book me-1"></i> Справочник
            </a>
        </div>

        <!-- Поиск -->
        <div class="search-wrapper position-relative mx-auto">
            <div class="input-group">
                <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" name="q" class="form-control border-0 py-2 shadow-none" placeholder="Поиск оборудования..."
                       hx-get="{% url 'search' %}" hx-trigger="keyup changed delay:500ms" hx-target="#search-results" autocomplete="off">
            </div>
            <div id="search-results" class="position-absolute w-100 shadow-lg bg-white rounded-3 mt-1 overflow-hidden" style="z-index: 1050;"></div>
        </div>

        <!-- Уголок пользователя -->
        <div class="dropdown user-block d-flex align-items-center justify-content-end">
            <div class="d-flex align-items-center text-white" role="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="text-end me-3 d-none d-sm-block">
                    <!-- Только Username и стрелочка -->
                    <span class="fw-bold">{{ user.username|default:"Администратор" }} <i class="bi bi-chevron-down ms-1 small"></i></span>
                </div>
                <div class="rounded-circle bg-primary shadow-sm d-flex align-items-center justify-content-center" 
                     style="width: 40px; height: 40px; border: 2px solid rgb(255, 255, 255);">
                    {{ user.email|slice:":2"|upper }}
                </div>
            </div>

            <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-3 mt-3 p-0 overflow-hidden" style="min-width: 240px;">
                <!-- Заголовок с фоном -->
                <li class="user-info-header px-3 py-3">
                    <div class="fw-bold text-dark text-truncate">{{ user.username|default:"Администратор" }}</div>
                    <div class="text-muted small text-truncate">{{ user.email }}</div>
                </li>
                
                {% if user.is_staff %}                
                <li>
                    <a class="dropdown-item d-flex align-items-center" href="#">
                        <i class="bi bi-people me-3 text-secondary"></i>
                        <span>Настройка пользователей</span>
                    </a>
                </li>
                <li>
                    <a class="dropdown-item rounded-2 py-2 d-flex align-items-center" href="{% url 'notification_settings' %}">
                        <i class="bi bi-bell me-3 text-muted"></i>
                        <span>Настройка уведомлений</span>
                    </a>
                </li>
                {% endif %}

                <!-- Удаляем лишний <hr> перед выходом, если используем границы у каждого элемента, 
                    либо оставляем его для явного отделения опасной зоны -->
                <li><hr class="dropdown-divider m-0" style="opacity: 0.1;"></li>
                
                <li>
                    <form action="{% url 'logout' %}" method="post" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="dropdown-item text-danger logout-btn border-0">
                            <i class="bi bi-box-arrow-right me-3"></i>
                            <span class="fw-bold">Выйти</span>
                        </button>
                    </form>
                </li>
            </ul>
        </div>

    </div>
</header>
