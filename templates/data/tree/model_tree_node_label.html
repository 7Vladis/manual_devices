<button type="button"
        id="model-label-{{ model.uuid }}"
        class="tree-label {% if is_active or active_model and active_model.uuid == model.uuid %}is-active{% endif %}"
        hx-get="{% url 'model_detail' model.uuid %}"
        hx-target="#detail-container"
        title="{{ model.name }}"
        {% if oob %}hx-swap-oob="outerHTML"{% endif %}>
    <i class="bi bi-layers tree-label-icon"></i>
    <span class="text-truncate">{{ model.name }}</span>
</button>
