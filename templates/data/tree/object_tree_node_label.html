{% comment %}
Кликабельная строка объекта. Используется и деревом, и проводником — id должен
совпадать в обоих режимах, иначе OOB-обновление подсветки из карточки объекта
уходит в никуда (так и было в режиме проводника).
{% endcomment %}
<button type="button"
        id="node-label-{{ node.uuid }}"
        class="tree-label {% if is_active or active_object and active_object.uuid == node.uuid %}is-active{% endif %}"
        hx-get="{% url 'object_detail' node.uuid %}"
        hx-target="#detail-container"
        title="{{ node.name|default:node.model.name }}"
        {% if oob %}hx-swap-oob="outerHTML"{% endif %}>
    <i class="bi {% if node.children.all %}bi-folder-fill text-warning{% else %}bi-hdd-fill text-secondary{% endif %} tree-label-icon"></i>
    <span class="text-truncate">{{ node.name|default:node.model.name }}</span>
</button>
