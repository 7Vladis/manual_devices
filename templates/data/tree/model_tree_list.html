<div class="model-tree-list animate-fade">
    {% for ot in object_types %}
        {% if ot.models.all %}
        <div class="mb-4">
            <!-- Заголовок группы (Тип оборудования) -->
            <div class="d-flex align-items-center mb-2 px-1">
                <i class="bi bi-tags-fill text-muted me-2 small"></i>
                <span class="text-uppercase small fw-bold text-muted" style="letter-spacing: 0.5px;">{{ ot.type }}</span>
                <span class="badge bg-light text-dark ms-2 rounded-pill small">{{ ot.models.all|length }}</span>
            </div>
            
            <!-- Список моделей в этой группе -->
            <ul class="list-unstyled ps-2 border-start border-light" style="margin-left: 6px;">
                {% for model in ot.models.all %}
                <li class="tree-item d-flex align-items-center justify-content-between p-2 rounded-2 hover-bg-light transition-all mb-1" id="model-node-{{ model.uuid }}">
                    
                    <!-- Подключаем микро-шаблон лейбла модели для автоматической серверной подсветки -->
                    {% include 'data/tree/model_tree_node_label.html' with model=model %}
                    
                    <div class="tree-actions d-flex align-items-center gap-1 opacity-100 ms-2">
                        <!-- Кнопка удаления модели -->
                        <button type="button" class="btn btn-link text-danger p-1 m-0 d-flex align-items-center"
                                hx-post="{% url 'delete_model' model.uuid %}"
                                hx-target="#model-node-{{ model.uuid }}"
                                hx-swap="outerHTML"
                                hx-confirm="Вы уверены, что хотите удалить модель '{{ model.name }}'? Все связанные объекты потеряют ссылку на модель."
                                title="Удалить">
                            <i class="bi bi-trash3 small"></i>
                        </button>
                    </div>
                </li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
    {% empty %}
        <div class="p-3 text-center text-muted small">Модели отсутствуют</div>
    {% endfor %}
</div>
