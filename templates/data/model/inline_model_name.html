<!-- templates/data/model/inline_model_name.html -->
<div id="model-name-display-container" class="animate-fade">
<div id="model-name-error"></div>
{% if editing %}
    <form hx-post="{% url 'edit_model_name' model_obj.uuid %}"
          hx-target="#model-name-display-container"
          hx-swap="outerHTML"
          class="d-flex gap-2 align-items-center mb-0">
        {% csrf_token %}
        <input type="text" name="name" value="{{ model_obj.name }}"
               class="form-control fw-bold"
               style="max-width: 420px; font-size: 1.25rem; height: 40px;"
               autocomplete="off" autofocus required
               onkeydown="if(event.key==='Escape'){ htmx.ajax('GET', '{% url 'edit_model_name' model_obj.uuid %}?cancel=1', {target: '#model-name-display-container', swap: 'outerHTML'}); }">
        <button type="submit" class="btn btn-success btn-icon" title="Сохранить (Enter)"><i class="bi bi-check-lg fs-6"></i></button>
        <button type="button" class="btn btn-light border btn-icon"
                hx-get="{% url 'edit_model_name' model_obj.uuid %}?cancel=1"
                hx-target="#model-name-display-container"
                hx-swap="outerHTML"
                title="Отмена (Esc)"><i class="bi bi-x-lg fs-6"></i></button>
    </form>
{% else %}
    <h1 {% if not request.user.is_junior %}hx-get="{% url 'edit_model_name' model_obj.uuid %}" hx-target="#model-name-display-container" hx-swap="outerHTML"{% endif %}
        class="fw-bold mb-0 text-dark d-inline-flex align-items-center editable-trigger"
        style="font-size: 1.35rem; line-height: 1.25; cursor: pointer;">
        <span>{{ model_obj.name }}</span>
        {% if not request.user.is_junior %}<i class="bi bi-pencil-square edit-icon fs-6"></i>{% endif %}
    </h1>
{% endif %}
</div>
