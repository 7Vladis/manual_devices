<!-- templates/data/model/inline_model_name.html -->
<div id="model-name-display-container" class="animate-fade d-inline-block">
{% if editing %}
    <form hx-post="{% url 'edit_model_name' model_obj.uuid %}" 
          hx-target="#model-name-display-container" 
          hx-swap="outerHTML" 
          class="d-inline-flex gap-2 align-items-center">
        {% csrf_token %}
        <input type="text" 
               name="name" 
               value="{{ model_obj.name }}" 
               class="form-control form-control-lg fw-bold border-0 bg-light py-1 shadow-none" 
               style="max-width: 400px; font-size: 1.35rem;"
               autocomplete="off"
               required>
        <button type="submit" class="btn btn-success btn-sm py-1 px-2" title="Сохранить"><i class="bi bi-check-lg"></i></button>
        <button type="button" class="btn btn-light btn-sm py-1 px-2 border" 
                hx-get="{% url 'edit_model_name' model_obj.uuid %}?cancel=1" 
                hx-target="#model-name-display-container" 
                hx-swap="outerHTML"
                title="Отмена"><i class="bi bi-x-lg"></i></button>
    </form>
{% else %}
    <h4 hx-get="{% url 'edit_model_name' model_obj.uuid %}" 
        hx-target="#model-name-display-container" 
        hx-swap="outerHTML" 
        style="cursor: pointer;" 
        class="fw-bold mb-1 text-dark d-inline-block">
        {{ model_obj.name }} <i class="bi bi-pencil-square ms-1 text-muted" style="font-size: 0.9rem;"></i>
    </h4>
{% endif %}
</div>
