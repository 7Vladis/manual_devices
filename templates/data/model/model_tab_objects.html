<div class="card border-0 shadow-sm p-4 bg-white animate-fade" style="border-radius: 8px;">
    <h6 class="fw-bold mb-3 text-dark"><i class="bi bi-box-seam me-2"></i>Связанные объекты (состоят из этой модели)</h6>

    <div class="d-flex flex-column gap-2">
        {% for item in objects %}
        <!-- Клик по объекту загружает детали объекта и переключает сайдбар через ?sidebar=1 -->
        <div class="card p-3 border hover-bg-light transition-all shadow-none" 
             style="border-radius: 8px; cursor: pointer;"
             hx-get="{% url 'object_detail' item.uuid %}?sidebar=1" 
             hx-target="#detail-container">
            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <div class="rounded-circle bg-light d-flex align-items-center justify-content-center me-3" style="width: 40px; height: 40px;">
                        <i class="bi bi-wrench text-muted"></i>
                    </div>
                    <div>
                        <span class="fw-bold text-dark small d-block">{{ item.name|default:item.model.name }}</span>
                        <small class="text-muted d-block" style="font-size: 0.75rem;">Инв. №: {{ item.inventory_number|default:"Без инв. номера" }}</small>
                    </div>
                </div>
                <div>
                    <span class="badge bg-light text-muted border py-1 px-2" style="font-size: 0.75rem;">Перейти</span>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="text-center py-5 text-muted small border border-dashed rounded-3">
            <i class="bi bi-info-circle fs-3 d-block mb-2 text-secondary opacity-50"></i>
            В системе пока нет объектов, созданных на основе этой модели.
        </div>
        {% endfor %}
    </div>
</div>
