<!-- templates/data/model/inline_spec_row.html -->
<tr id="spec-row-{{ key|slugify }}">
    {% if editing %}
    <td colspan="3" class="p-2">
        <form hx-post="{% url 'model_spec_edit' model_obj.uuid %}" hx-target="#tab-pane-model-specs"
              class="row g-2 align-items-center">
            {% csrf_token %}
            <input type="hidden" name="old_key" value="{{ key }}">
            <div class="col-12 col-md">
                <input type="text" name="key" value="{{ key }}" class="form-control" autofocus required>
            </div>
            <div class="col-12 col-md">
                <input type="text" name="value" value="{{ value }}" class="form-control" required>
            </div>
            <div class="col-12 col-md-auto d-flex gap-1">
                <button type="submit" class="btn btn-success btn-icon" title="Сохранить"><i class="bi bi-check-lg"></i></button>
                <button type="button" class="btn btn-light border btn-icon" title="Отмена"
                        hx-get="{% url 'model_tab' model_obj.uuid 'specs' %}" hx-target="#tab-pane-model-specs">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </form>
    </td>
    {% else %}
    <td class="kv-key">{{ key }}</td>
    <td class="kv-val">{{ value }}</td>
    <td class="text-end">
        <span class="d-inline-flex gap-1">
            <button type="button" class="btn btn-light border btn-icon"
                    style="width: 30px; height: 30px;"
                    hx-get="{% url 'model_spec_edit' model_obj.uuid %}?key={{ key|urlencode }}"
                    hx-target="#spec-row-{{ key|slugify }}"
                    hx-swap="outerHTML"
                    title="Изменить характеристику">
                <i class="bi bi-pencil"></i>
            </button>
            <button type="button" class="btn btn-light border btn-icon text-danger"
                    style="width: 30px; height: 30px;"
                    hx-post="{% url 'model_spec_delete' model_obj.uuid %}"
                    hx-target="#tab-pane-model-specs"
                    hx-vals='{"key": "{{ key|escapejs }}"}'
                    hx-confirm="Удалить характеристику «{{ key }}»?"
                    title="Удалить характеристику">
                <i class="bi bi-trash3"></i>
            </button>
        </span>
    </td>
    {% endif %}
</tr>
