<!-- templates/data/model/model_details.html -->
<div class="detail-view animate-fade">

    <header class="detail-header">
        <nav class="obj-breadcrumb" aria-label="Расположение модели">
            <span class="current"><i class="bi bi-layers me-1"></i>Модели оборудования</span>
            <i class="bi bi-chevron-right sep"></i>
            <span class="current">{{ model_obj.object_type.type }}</span>
        </nav>

        <div class="detail-title-row">
            <div class="detail-title-main">
                {% include 'data/model/inline_model_name.html' with model_obj=model_obj editing=False %}
            </div>

            <div class="detail-actions">
                <span class="pill pill-neutral">
                    <i class="bi bi-tag-fill"></i>
                    <span class="pill-label">Тип:</span>
                    <strong>{{ model_obj.object_type.type }}</strong>
                </span>
            </div>
        </div>

        <div class="meta-grid">
            <div class="meta-cell">
                <span class="meta-label"><i class="bi bi-cpu"></i>Характеристик в шаблоне</span>
                <span class="meta-value">{{ specs_count }}</span>
            </div>
            <div class="meta-cell">
                <span class="meta-label"><i class="bi bi-box-seam"></i>Объектов на этой модели</span>
                <span class="meta-value">{{ objects_count }}</span>
            </div>
        </div>
    </header>

    <nav class="seg-tabs" id="modelTabs" role="tablist">
        <button class="seg-tab active" id="model-specs-tab" type="button" role="tab"
                data-bs-toggle="pill" data-bs-target="#tab-pane-model-specs"
                hx-get="{% url 'model_tab' model_obj.uuid 'specs' %}"
                hx-target="#tab-pane-model-specs" hx-trigger="click">
            <i class="bi bi-cpu"></i>Характеристики
            <span class="tab-count" id="tab-count-model-specs">{{ specs_count }}</span>
        </button>

        <button class="seg-tab" id="model-objects-tab" type="button" role="tab"
                data-bs-toggle="pill" data-bs-target="#tab-pane-model-objects"
                hx-get="{% url 'model_tab' model_obj.uuid 'objects' %}"
                hx-target="#tab-pane-model-objects" hx-trigger="click">
            <i class="bi bi-box-seam"></i>Объекты
            <span class="tab-count" id="tab-count-model-objects">{{ objects_count }}</span>
        </button>
    </nav>

    <div class="tab-content detail-body" id="model-tab-panes">
        <div class="tab-pane fade show active" id="tab-pane-model-specs" role="tabpanel" aria-labelledby="model-specs-tab"
             hx-get="{% url 'model_tab' model_obj.uuid 'specs' %}" hx-trigger="load" hx-swap="innerHTML">
            <div class="text-center py-5"><span class="spinner-border spinner-border-sm text-primary" role="status"></span></div>
        </div>

        <div class="tab-pane fade" id="tab-pane-model-objects" role="tabpanel" aria-labelledby="model-objects-tab">
            <div class="text-center py-5"><span class="spinner-border spinner-border-sm text-primary" role="status"></span></div>
        </div>
    </div>

</div>
