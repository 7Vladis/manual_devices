<div class="d-flex align-items-center justify-content-between gap-2 flex-wrap mb-2">
    <span class="entry-detail-title mb-0">Объекты с этим правилом</span>
    <button type="button" class="btn btn-light border btn-sm fw-semibold"
            hx-get="{% url 'edit_rule_objects' item.uuid %}"
            hx-target="#rule-objects-content-{{ item.uuid }}"
            hx-swap="innerHTML">
        <i class="bi bi-diagram-3"></i>Изменить привязки
    </button>
</div>
<div class="d-flex flex-wrap gap-2">
    {% for plan in item.plans.all %}
    <a href="{% url 'dict' %}?object={{ plan.data_object.uuid }}" class="chip-link">
        <i class="bi bi-box-seam text-secondary"></i>
        <span class="text-truncate">{{ plan.data_object.name|default:plan.data_object.model.name }}</span>
        <i class="bi bi-arrow-right-short chip-sub"></i>
    </a>
    {% empty %}
    <span class="text-muted small">Правило ещё не используется. Добавьте объекты через «Изменить привязки».</span>
    {% endfor %}
</div>
