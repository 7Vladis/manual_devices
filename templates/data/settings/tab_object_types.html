<!-- templates/data/settings/tab_object_types.html -->
<div class="card border-0 shadow-sm p-4 bg-white animate-fade" style="border-radius: 12px;">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="fw-bold text-dark m-0"><i class="bi bi-tags text-primary me-2"></i>Типы объектов</h5>
        <button type="button" class="btn btn-primary btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#addObjectTypeModal">
            <i class="bi bi-plus-lg me-1"></i> Добавить тип
        </button>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0" style="font-size: 0.85rem;">
            <thead>
                <tr class="text-muted border-bottom" style="font-size: 0.75rem;">
                    <th class="py-2 text-uppercase">Название типа оборудования</th>
                    <th class="py-2 text-uppercase text-center">Используется в моделях</th>
                    <th class="py-2 text-uppercase text-end">Действие</th>
                </tr>
            </thead>
            <tbody>
                {% for item in object_types %}
                <tr>
                    <td class="fw-bold text-dark py-3">{{ item.type }}</td>
                    <td class="text-center py-3">
                        <span class="badge bg-light text-primary border rounded-pill px-3 py-1">{{ item.models_count }} мод.</span>
                    </td>
                    <td class="text-end py-3">
                        <div id="error-container-type-{{ item.uuid }}" class="d-inline-block text-start me-2"></div>
                        
                        <button type="button" class="btn btn-outline-danger btn-sm border-0"
                                hx-post="{% url 'delete_object_type' item.uuid %}"
                                hx-target-error="#error-container-type-{{ item.uuid }}"
                                hx-confirm="Вы уверены, что хотите удалить тип оборудования '{{ item.type }}'?"
                                title="Удалить">
                            <i class="bi bi-trash3"></i>
                        </button>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center py-4 text-muted">Список пуст.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- Модальное окно создания типа объекта -->
<div class="modal fade" id="addObjectTypeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 12px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Новый тип объекта</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form hx-post="{% url 'create_object_type' %}" 
                  hx-target="#settings-page-wrapper"
                  hx-on::after-request="if (event.detail.elt === this) { bootstrap.Modal.getInstance(document.getElementById('addObjectTypeModal')).hide(); }">
                {% csrf_token %}
                <div class="modal-body py-4">
                    <label class="form-label small fw-bold text-muted">НАЗВАНИЕ ТИПА ОБОРУДОВАНИЯ</label>
                    <input type="text" name="type" class="form-control bg-light border-0 py-2 shadow-none" placeholder="Котлы, Насосы, Кабели..." required autocomplete="off">
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary px-4 fw-bold">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>
