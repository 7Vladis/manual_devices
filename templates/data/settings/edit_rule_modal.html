<!-- templates/data/settings/edit_rule_modal.html -->
<div class="sheet-header">
    <span class="sheet-icon bg-light-primary text-primary"><i class="bi bi-sliders"></i></span>
    <div class="sheet-heading">
        <h5>Настройка правила</h5>
        <p class="text-truncate" title="{{ rule_obj.name }}">{{ rule_obj.name }}</p>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
</div>

<form hx-post="{% url 'edit_rule_settings' rule_obj.uuid %}"
      hx-on::after-request="if (event.detail.elt === this && event.detail.successful) { bootstrap.Modal.getInstance(document.getElementById('editRuleSettingsModal')).hide(); }">
    {% csrf_token %}
    {% include 'data/settings/_rule_form_body.html' with mode='edit' error_id=rule_error_id %}
    <div class="sheet-footer">
        <span class="footer-note">Даты объектов с этим правилом пересчитаются.</span>
        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Отмена</button>
        <button type="submit" class="btn btn-primary px-4 fw-semibold"><i class="bi bi-check-lg"></i>Сохранить</button>
    </div>
</form>
