<!-- templates/data/settings/create_rule_modal.html -->
<div class="sheet-header">
    <span class="sheet-icon bg-light-primary text-primary"><i class="bi bi-calendar-plus"></i></span>
    <div class="sheet-heading">
        <h5>Новое правило планирования</h5>
        <p>Определяет, на какую дату назначать следующее ТО после выполнения работ.</p>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
</div>

<form hx-post="{% url 'create_rule_settings' %}"
      hx-on::after-request="if (event.detail.elt === this && event.detail.successful) { bootstrap.Modal.getInstance(document.getElementById('createRuleSettingsModal')).hide(); }">
    {% csrf_token %}
    {% include 'data/settings/_rule_form_body.html' with mode='create' error_id='create-rule-error' %}
    <div class="sheet-footer">
        <span class="footer-note"><span class="req">*</span> — обязательные поля</span>
        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Отмена</button>
        <button type="submit" class="btn btn-primary px-4 fw-semibold"><i class="bi bi-plus-lg"></i>Создать правило</button>
    </div>
</form>
