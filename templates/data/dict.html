{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-0 flex-grow-1 d-flex flex-column" style="height: calc(100vh - 56px); overflow: hidden;">
    <div class="row g-0 h-100 flex-grow-1">
        
        <!-- ЛЕВАЯ КОЛОНКА: Сайдбар (Дерево / Проводник) -->
        <aside class="col-12 col-md-4 col-xl-3 bg-white border-end d-flex flex-column h-100" 
               id="sidebar-container"
               hx-get="{% url 'dict' %}?tab={{ active_tab }}&sidebar=1"
               hx-trigger="explorerModeChanged from:body">
            {% include 'data/tree/dict_sidebar.html' %}
        </aside>

        <!-- ПРАВАЯ КОЛОНКА: Детальная карточка -->
        <main class="col-12 col-md-8 col-xl-9 d-flex flex-column h-100 bg-light" id="detail-container">
            {% if active_object %}
                <div hx-get="{% url 'object_detail' active_object.uuid %}" hx-trigger="load" hx-target="this" hx-swap="outerHTML">
                    <div class="d-flex align-items-center justify-content-center h-100 p-5">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                </div>
            {% elif active_model %}
                <div hx-get="{% url 'model_detail' active_model.uuid %}" hx-trigger="load" hx-target="this" hx-swap="outerHTML">
                    <div class="d-flex align-items-center justify-content-center h-100 p-5">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                </div>
            {% else %}
                {% include 'data/includes/detail_placeholder.html' %}
            {% endif %}
        </main>
        
    </div>
</div>

<!-- Модальное окно: Обслуживание (ТО) -->
<div class="modal fade" id="serviceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 520px;">
        <div class="modal-content border-0 shadow-lg overflow-hidden" style="border-radius: var(--radius-lg);" id="service-modal-content">
        </div>
    </div>
</div>

<!-- Модальное окно: Создание Объекта -->
<div class="modal fade" id="createObjectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg overflow-hidden" style="border-radius: var(--radius-lg);">
        </div>
    </div>
</div>

<!-- Модальное окно: Создание Модели -->
<div class="modal fade" id="createModelModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg overflow-hidden" style="border-radius: var(--radius-lg);">
        </div>
    </div>
</div>

<!-- Модальное окно: Редактирование Правила ТО -->
<div class="modal fade" id="editRuleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 540px;">
        <div class="modal-content border-0 shadow-lg overflow-hidden" style="border-radius: var(--radius-lg);" id="edit-rule-modal-content">
        </div>
    </div>
</div>

<!-- Модальное окно: Подтверждение удаления (объект / модель) -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 560px;">
        <div class="modal-content border-0 shadow-lg overflow-hidden" style="border-radius: var(--radius-lg);" id="confirm-modal-content">
        </div>
    </div>
</div>

<!-- Модальное окно: Клонирование Объекта -->
<div class="modal fade" id="cloneObjectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 560px;">
        <div class="modal-content border-0 shadow-lg overflow-hidden" style="border-radius: var(--radius-lg);">
        </div>
    </div>
</div>
{% endblock %}
