{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-4 py-3">
    
    <!-- Сводка (4 равные карточки метрик, выровненные точно по краям шапки) -->
    <div class="row g-3 mb-4">
        
        <!-- 1. Всего объектов -->
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card p-3 clickable-card h-100 border-0 shadow-sm" 
                 hx-get="{% url 'maintenance_list' %}?period=all" 
                 hx-target="#maintenance-container">
                <div class="d-flex align-items-center">
                    <div class="rounded-3 bg-light-primary text-primary me-3 d-flex align-items-center justify-content-center flex-shrink-0" 
                         style="width: 48px; height: 48px;">
                        <i class="bi bi-box-seam-fill fs-4"></i>
                    </div>
                    <div class="flex-grow-1 min-w-0">
                        <span class="text-muted d-block fw-bold text-uppercase" style="font-size: 0.68rem; letter-spacing: 0.6px;">Всего объектов</span>
                        <div class="fs-4 fw-bold text-dark lh-1 mt-1">{{ total_objects }}</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. Просрочено -->
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card p-3 clickable-card h-100 shadow-sm {% if overdue_count > 0 %}overdue-card{% else %}border-0{% endif %}" 
                 hx-get="{% url 'maintenance_list' %}?period=overdue" 
                 hx-target="#maintenance-container">
                <div class="d-flex align-items-center">
                    <div class="rounded-3 bg-light-danger text-danger me-3 d-flex align-items-center justify-content-center flex-shrink-0" 
                         style="width: 48px; height: 48px;">
                        <i class="bi bi-exclamation-triangle-fill fs-4"></i>
                    </div>
                    <div class="flex-grow-1 min-w-0">
                        <span class="text-muted d-block fw-bold text-uppercase" style="font-size: 0.68rem; letter-spacing: 0.6px;">Просрочено</span>
                        <div class="fs-4 fw-bold text-danger lh-1 mt-1">{{ overdue_count }}</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 3. План на неделю -->
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card p-3 clickable-card h-100 border-0 shadow-sm" 
                 hx-get="{% url 'maintenance_list' %}?period=week" 
                 hx-target="#maintenance-container">
                <div class="d-flex align-items-center">
                    <div class="rounded-3 bg-light-info text-info me-3 d-flex align-items-center justify-content-center flex-shrink-0" 
                         style="width: 48px; height: 48px;">
                        <i class="bi bi-calendar-week-fill fs-4"></i>
                    </div>
                    <div class="flex-grow-1 min-w-0">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="text-muted fw-bold text-uppercase" style="font-size: 0.68rem; letter-spacing: 0.6px;">План на неделю</span>
                            <span class="fw-bold text-dark small">{{ week_done }}/{{ week_all }}</span>
                        </div>
                        <div class="progress bg-light" style="height: 6px; border-radius: 4px;">
                            <div class="progress-bar bg-primary rounded-pill" style="width: {{ week_percent|floatformat:0 }}%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. План на месяц -->
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card p-3 clickable-card h-100 border-0 shadow-sm" 
                 hx-get="{% url 'maintenance_list' %}?period=month" 
                 hx-target="#maintenance-container">
                <div class="d-flex align-items-center">
                    <div class="rounded-3 bg-light-success text-success me-3 d-flex align-items-center justify-content-center flex-shrink-0" 
                         style="width: 48px; height: 48px;">
                        <i class="bi bi-calendar-month-fill fs-4"></i>
                    </div>
                    <div class="flex-grow-1 min-w-0">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="text-muted fw-bold text-uppercase" style="font-size: 0.68rem; letter-spacing: 0.6px;">План на месяц</span>
                            <span class="fw-bold text-dark small">{{ month_done }}/{{ month_all }}</span>
                        </div>
                        <div class="progress bg-light" style="height: 6px; border-radius: 4px;">
                            <div class="progress-bar bg-success rounded-pill" style="width: {{ month_percent|floatformat:0 }}%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Заголовок списка работ -->
    <div class="d-flex align-items-center justify-content-between mb-3 px-1">
        <h6 class="m-0 fw-bold text-dark d-flex align-items-center gap-2">
            <i class="bi bi-list-check text-primary fs-5"></i>
            <span>Список работ:</span>
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-2.5 py-1" id="period-label">
                План на неделю
            </span>
        </h6>
    </div>

    <!-- Контейнер карточек ТО -->
    <div id="maintenance-container" hx-get="{% url 'maintenance_list' %}?period=week" hx-trigger="load once">
        <div class="text-center py-5">
            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
            <div class="text-muted small mt-2">Загрузка плана обслуживания...</div>
        </div>
    </div>

</div>
{% endblock %}
