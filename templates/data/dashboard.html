{% extends 'base.html' %}

{% block title %}План ТО — ManDev{% endblock %}

{% block content %}
<div class="plan-page">

    <div class="plan-head">
        <h1>План технического обслуживания</h1>
        <span class="plan-today">Сегодня {{ today|date:"j E Y" }}</span>
    </div>

    {% include 'data/includes/plan_filters.html' %}

    <div id="maintenance-container" hx-get="{% url 'maintenance_list' %}?period=week" hx-trigger="load once">
        <div class="text-center py-5 text-muted">
            <span class="spinner-border spinner-border-sm" role="status"></span>
            <div class="small mt-2">Загружаем план обслуживания…</div>
        </div>
    </div>

</div>

<!-- Фиксация ТО прямо из плана: решение принимается здесь, здесь же и действие -->
<div class="modal fade" id="serviceModal" tabindex="-1" aria-hidden="true" data-md-reset>
    <div class="modal-dialog modal-dialog-centered" style="max-width: 520px;">
        <div class="modal-content" id="service-modal-content"></div>
    </div>
</div>

<script>
    /**
     * Подсветка выбранного фильтра сразу по клику: ответ сервера придёт
     * через мгновение и перерисует полосу целиком, но пользователь должен
     * видеть отклик немедленно. Делегирование — полоса пересоздаётся
     * OOB-свопом после каждой загрузки списка.
     */
    document.addEventListener('click', (event) => {
        const tile = event.target.closest('#plan-filters .stat-tile');
        if (!tile) return;
        document.querySelectorAll('#plan-filters .stat-tile').forEach((t) => t.classList.remove('is-active'));
        tile.classList.add('is-active');
    });
</script>
{% endblock %}
