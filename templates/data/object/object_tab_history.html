<div class="card border-0 shadow-sm p-4 bg-white animate-fade" style="border-radius: 8px;">
    <h6 class="fw-bold mb-3 text-dark"><i class="bi bi-clock-history me-2"></i>История событий объекта</h6>
    
    <div class="position-relative ps-3 border-start border-light" style="margin-left: 10px;">
        {% for event in history %}
        <div class="position-relative mb-4">
            <!-- Стилизованная точка на таймлайне -->
            <span class="position-absolute translate-middle bg-primary rounded-circle" style="left: -23px; top: 10px; width: 10px; height: 10px;"></span>
            
            <div class="small">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <strong class="text-dark">{{ event.action }}</strong>
                    <span class="text-muted fs-7">{{ event.created_at|date:"d.m.Y H:i" }}</span>
                </div>
                <span class="text-muted fs-7">Исполнитель: {{ event.user.username|default:event.user.email }}</span>
            </div>
        </div>
        {% empty %}
        <div class="text-center py-4 text-muted small">История пуста.</div>
        {% endfor %}
    </div>
</div>
