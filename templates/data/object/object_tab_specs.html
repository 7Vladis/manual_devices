<div class="card border-0 shadow-sm p-4 bg-white animate-fade" style="border-radius: 8px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="fw-bold mb-0 text-dark"><i class="bi bi-cpu me-2"></i>Технические характеристики</h6>
        <!-- Клик по кнопке загружает модель справа и переключает сайдбар на вкладку "Модели" слева -->
        <button class="btn btn-outline-primary btn-sm fw-bold"
                hx-get="{% url 'model_detail' obj.model.uuid %}?sidebar=1"
                hx-target="#detail-container">
            <i class="bi bi-pencil-square me-1"></i> Изменить в модели
        </button>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover table-borderless align-middle mb-0" style="font-size: 0.9rem;">
            <thead>
                <tr class="border-bottom text-muted" style="font-size: 0.75rem; letter-spacing: 0.5px;">
                    <th class="py-2 w-50 text-uppercase">Параметр (Ключ)</th>
                    <th class="py-2 w-50 text-uppercase">Значение</th>
                </tr>
            </thead>
            <tbody>
                {% for key, val in specifications.items %}
                <tr class="border-bottom border-light">
                    <td class="text-muted py-2 w-50">{{ key }}</td>
                    <td class="fw-bold text-dark py-2">{{ val }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="2" class="text-center py-4 text-muted small">У модели данного объекта не заданы технические характеристики.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
