<!-- templates/data/object/inline_model.html -->
<span id="model-display-container" class="meta-value position-relative inline-edit-wrapper">
{% if editing %}
    <span class="d-flex align-items-center gap-1 w-100 position-relative">
        <input type="text"
               name="q"
               class="form-control form-control-sm"
               placeholder="Поиск модели..."
               hx-get="{% url 'suggest' %}?field=model_inline&target_obj_uuid={{ obj.uuid }}"
               hx-trigger="keyup changed delay:150ms, focus"
               hx-target="#results-model-inline"
               autocomplete="off"
               autofocus
               style="font-size: 0.85rem; height: 30px;"
               onkeydown="if(event.key==='Escape'){ htmx.ajax('GET', '{% url 'edit_object_model' obj.uuid %}?cancel=1', {target: '#model-display-container', swap: 'outerHTML'}); }">

        <button type="button"
                class="btn btn-link text-muted p-0 border-0 flex-shrink-0"
                hx-get="{% url 'edit_object_model' obj.uuid %}?cancel=1"
                hx-target="#model-display-container"
                hx-swap="outerHTML"
                title="Отмена (Esc)">
            <i class="bi bi-x-lg"></i>
        </button>

        <span id="results-model-inline" class="position-absolute" style="top: 100%; left: 0; width: 280px; z-index: 1250;"></span>
    </span>
{% else %}
    <span class="d-inline-flex align-items-center text-truncate {% if not request.user.is_junior %}editable-trigger{% endif %}"
          {% if not request.user.is_junior %}
          hx-get="{% url 'edit_object_model' obj.uuid %}"
          hx-target="#model-display-container"
          hx-swap="outerHTML"
          style="cursor: pointer;"
          title="Модель оборудования — кликните, чтобы изменить"
          {% endif %}>
        <span class="text-truncate">{{ obj.model.name }}</span>
        {% if not request.user.is_junior %}<i class="bi bi-pencil-square edit-icon"></i>{% endif %}
    </span>
{% endif %}
</span>
