<!-- templates/data/object/inline_model.html -->
<span id="model-display-container" class="animate-fade d-inline-block">
{% if editing %}
    <form hx-post="{% url 'edit_object_model' obj.uuid %}" 
          hx-target="#model-display-container" 
          hx-swap="outerHTML" 
          class="d-inline-flex gap-1 align-items-center flex-nowrap">
        {% csrf_token %}
        
        <div id="search-wrapper-model" class="position-relative" style="min-width: 180px; max-width: 250px;">
            <input type="text" name="q" class="form-control form-control-sm bg-light py-1 shadow-none" 
                   placeholder="Название модели..."
                   hx-get="{% url 'suggest' %}?field=model"
                   hx-trigger="keyup changed delay:300ms"
                   hx-target="#results-model"
                   autocomplete="off"
                   autofocus
                   style="font-size: 0.8rem; height: 31px;"
                   required>
            <div id="results-model"></div>
        </div>

        <button type="submit" class="btn btn-success btn-sm py-1 px-2 flex-shrink-0 d-flex align-items-center justify-content-center" style="height: 31px; width: 31px;" title="Сохранить">
            <i class="bi bi-check-lg"></i>
        </button>
        <button type="button" class="btn btn-light btn-sm py-1 px-2 border flex-shrink-0 d-flex align-items-center justify-content-center" style="height: 31px; width: 31px;" 
                hx-get="{% url 'edit_object_model' obj.uuid %}?cancel=1" 
                hx-target="#model-display-container" 
                hx-swap="outerHTML"
                title="Отмена">
            <i class="bi bi-x-lg"></i>
        </button>
    </form>
{% else %}
    <strong class="text-dark editable-trigger" 
            hx-get="{% url 'edit_object_model' obj.uuid %}" 
            hx-target="#model-display-container" 
            hx-swap="outerHTML" 
            style="cursor: pointer; font-weight: normal;">
        <span class="text-muted me-1"><i class="bi bi-tag me-1"></i>Модель:</span>
        <strong class="text-dark fw-bold">{{ obj.model.name }}</strong>
        <i class="bi bi-pencil-square edit-icon"></i>
    </strong>
{% endif %}
</span>
