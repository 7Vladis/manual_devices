<!-- templates/data/object/inline_model.html -->
<span id="model-display-container" class="animate-fade d-inline-block">
{% if editing %}
    <form hx-post="{% url 'edit_object_model' obj.uuid %}" 
          hx-target="#model-display-container" 
          hx-swap="outerHTML" 
          class="d-inline-flex gap-2 align-items-center flex-wrap">
        {% csrf_token %}
        
        <!-- Контейнер умного поиска модели -->
        <div id="search-wrapper-model" class="position-relative" style="min-width: 250px;">
            <input type="text" name="q" class="form-control form-control-sm bg-light py-1 shadow-none" 
                   placeholder="Начните вводить название модели..."
                   hx-get="{% url 'suggest' %}?field=model"
                   hx-trigger="keyup changed delay:300ms"
                   hx-target="#results-model"
                   autocomplete="off"
                   style="font-size: 0.8rem;"
                   required>
            <div id="results-model"></div>
        </div>

        <button type="submit" class="btn btn-success btn-sm py-1 px-2" title="Сохранить"><i class="bi bi-check-lg"></i></button>
        <button type="button" class="btn btn-light btn-sm py-1 px-2 border" 
                hx-get="{% url 'edit_object_model' obj.uuid %}?cancel=1" 
                hx-target="#model-display-container" 
                hx-swap="outerHTML"
                title="Отмена"><i class="bi bi-x-lg"></i></button>
    </form>
{% else %}
    <i class="bi bi-tag me-1"></i>Модель: 
    <strong class="text-dark" 
            hx-get="{% url 'edit_object_model' obj.uuid %}" 
            hx-target="#model-display-container" 
            hx-swap="outerHTML" 
            style="cursor: pointer;">
        {{ obj.model.name }} <i class="bi bi-pencil-square ms-1 text-muted small"></i>
    </strong>
{% endif %}
</span>
