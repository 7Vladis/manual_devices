<!-- templates/data/object/inline_parent.html -->
<span id="parent-display-container" class="meta-value position-relative inline-edit-wrapper">
{% if editing %}
    <span class="d-flex align-items-center gap-1 w-100 position-relative">
        <span class="position-relative flex-grow-1" style="min-width: 0;">
            <input type="text"
                   id="parent-search-input"
                   name="q"
                   value="{% if current_parent %}{{ current_parent.name|default:current_parent.model.name }}{% endif %}"
                   class="form-control form-control-sm pe-4"
                   placeholder="Начните вводить название..."
                   hx-get="{% url 'suggest' %}?field=parent_inline&exclude_uuid={{ obj.uuid }}&target_obj_uuid={{ obj.uuid }}"
                   hx-trigger="keyup changed delay:150ms, focus"
                   hx-target="#results-parent-inline"
                   autocomplete="off"
                   autofocus
                   style="font-size: 0.85rem; height: 30px;"
                   onkeydown="if(event.key==='Escape'){ htmx.ajax('GET', '{% url 'edit_parent' obj.uuid %}?cancel=1', {target: '#parent-display-container', swap: 'outerHTML'}); }">

            <button type="button"
                    class="btn btn-link text-muted p-0 position-absolute end-0 top-50 translate-middle-y me-2 border-0"
                    onclick="const inp = document.getElementById('parent-search-input'); inp.value=''; inp.focus(); htmx.trigger(inp, 'keyup');"
                    title="Очистить поле">
                <i class="bi bi-x-circle-fill" style="font-size: 0.8rem;"></i>
            </button>
        </span>

        <button type="button"
                class="btn btn-link text-muted p-0 border-0 flex-shrink-0"
                hx-get="{% url 'edit_parent' obj.uuid %}?cancel=1"
                hx-target="#parent-display-container"
                hx-swap="outerHTML"
                title="Отмена (Esc)">
            <i class="bi bi-x-lg"></i>
        </button>

        <span id="results-parent-inline" class="position-absolute" style="top: 100%; left: 0; width: 290px; z-index: 1250;"></span>
    </span>
{% else %}
    <span class="d-inline-flex align-items-center text-truncate {% if not request.user.is_junior %}editable-trigger{% endif %}"
          {% if not request.user.is_junior %}
          hx-get="{% url 'edit_parent' obj.uuid %}"
          hx-target="#parent-display-container"
          hx-swap="outerHTML"
          style="cursor: pointer;"
          title="Родительский объект — кликните, чтобы изменить"
          {% endif %}>
        {% if current_parent %}
            <span class="text-truncate" title="{{ current_parent.name|default:current_parent.model.name }}">{{ current_parent.name|default:current_parent.model.name }}</span>
        {% else %}
            <span class="text-empty">корневой объект</span>
        {% endif %}
        {% if not request.user.is_junior %}<i class="bi bi-pencil-square edit-icon"></i>{% endif %}
    </span>
    {% if error %}
    <i class="bi bi-exclamation-circle-fill text-danger ms-2 flex-shrink-0 animate-fade" style="cursor: help;" title="{{ error }}"></i>
    {% endif %}
{% endif %}
</span>
