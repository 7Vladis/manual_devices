<!-- templates/data/object/inline_parent.html -->
<span id="parent-display-container" class="d-inline-block position-relative inline-edit-wrapper">
{% if editing %}
    <div class="d-inline-flex align-items-center position-relative">
        <div class="position-relative" style="min-width: 220px; max-width: 300px;">
            <input type="text" 
                   id="parent-search-input"
                   name="q" 
                   value="{% if current_parent %}{% if current_parent.name %}{{ current_parent.name }}{% elif current_parent.model %}{{ current_parent.model.name }}{% endif %}{% endif %}"
                   class="form-control form-control-sm bg-white border py-1 ps-2.5 pe-4 shadow-sm rounded-2" 
                   placeholder="Начните вводить родителя..."
                   hx-get="{% url 'suggest' %}?field=parent_inline&exclude_uuid={{ obj.uuid }}&target_obj_uuid={{ obj.uuid }}"
                   hx-trigger="keyup changed delay:150ms, focus"
                   hx-target="#results-parent-inline"
                   autocomplete="off"
                   autofocus
                   style="font-size: 0.85rem; height: 30px;"
                   onkeydown="if(event.key==='Escape'){ htmx.ajax('GET', '{% url 'edit_parent' obj.uuid %}?cancel=1', {target: '#parent-display-container', swap: 'outerHTML'}); }">

            <!-- Кнопка быстрой очистки поля -->
            <button type="button" 
                    class="btn btn-link text-muted p-0 position-absolute end-0 top-50 translate-middle-y me-2 border-0"
                    onclick="const inp = document.getElementById('parent-search-input'); inp.value=''; inp.focus(); htmx.trigger(inp, 'keyup');"
                    title="Очистить поле">
                <i class="bi bi-x-circle-fill" style="font-size: 0.8rem;"></i>
            </button>
        </div>

        <button type="button" 
                class="btn btn-sm btn-link text-muted p-1 ms-1 border-0" 
                hx-get="{% url 'edit_parent' obj.uuid %}?cancel=1" 
                hx-target="#parent-display-container" 
                hx-swap="outerHTML" 
                title="Отмена (Esc)">
            <i class="bi bi-x-lg fs-6"></i>
        </button>

        <div id="results-parent-inline" style="position: absolute; top: 100%; left: 0; width: 280px; z-index: 1200;"></div>
    </div>
{% else %}
    <span {% if not request.user.is_junior %}hx-get="{% url 'edit_parent' obj.uuid %}" hx-target="#parent-display-container" hx-swap="outerHTML"{% endif %}
          style="cursor: pointer;" 
          class="editable-trigger d-inline-flex align-items-center">
        <span class="text-muted">Родитель:</span>
        
        {% if current_parent %}
            <span class="ms-1 text-primary fw-semibold text-truncate" style="max-width: 220px;" title="{% if current_parent.name %}{{ current_parent.name }}{% elif current_parent.model %}{{ current_parent.model.name }}{% endif %}">
                {% if current_parent.name %}{{ current_parent.name }}{% elif current_parent.model %}{{ current_parent.model.name }}{% endif %}
            </span>
        {% else %}
            <span class="ms-1 text-muted">отсутствует</span>
        {% endif %}
        
        {% if not request.user.is_junior %}<i class="bi bi-pencil-square edit-icon ms-1"></i>{% endif %}
    </span>
{% endif %}
</span>
