<!-- templates/data/object/inline_name.html -->
<div id="name-display-container" class="animate-fade">
{% if editing %}
    <form hx-post="{% url 'edit_name' obj.uuid %}"
          hx-target="#name-display-container"
          hx-swap="outerHTML"
          class="d-flex gap-2 align-items-center mb-0">
        {% csrf_token %}
        <input type="text"
               name="name"
               value="{{ obj.name|default:'' }}"
               placeholder="{{ obj.model.name }}"
               class="form-control fw-bold"
               style="max-width: 460px; font-size: 18px; height: 38px;"
               autocomplete="off"
               autofocus
               required
               onkeydown="if(event.key==='Escape'){ htmx.ajax('GET', '{% url 'edit_name' obj.uuid %}?cancel=1', {target: '#name-display-container', swap: 'outerHTML'}); }">

        <button type="submit" class="btn btn-success btn-icon" title="Сохранить (Enter)">
            <i class="bi bi-check-lg fs-6"></i>
        </button>
        <button type="button" class="btn btn-light border btn-icon"
                hx-get="{% url 'edit_name' obj.uuid %}?cancel=1"
                hx-target="#name-display-container"
                hx-swap="outerHTML"
                title="Отмена (Esc)">
            <i class="bi bi-x-lg fs-6"></i>
        </button>
    </form>
{% else %}
    <h1 {% if not request.user.is_junior %}hx-get="{% url 'edit_name' obj.uuid %}" hx-target="#name-display-container" hx-swap="outerHTML"{% endif %}
        class="mb-0 d-inline-flex align-items-center editable-trigger"
        style="cursor: pointer;">
        <span>{{ obj.name|default:obj.model.name }}</span>
        {% if not request.user.is_junior %}<i class="bi bi-pencil-square edit-icon fs-6"></i>{% endif %}
    </h1>
{% endif %}
</div>
