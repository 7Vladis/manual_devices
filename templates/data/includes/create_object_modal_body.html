<!-- templates/data/includes/create_object_modal_body.html -->
<div class="modal-header border-0 pb-0 animate-fade">
    <h5 class="modal-title fw-bold">Новый объект</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<form hx-post="{% url 'create_object' %}" 
      hx-target="#sidebar-container" 
      hx-on::after-request="if (event.detail.elt === this) { bootstrap.Modal.getInstance(document.getElementById('createObjectModal')).hide(); }">
    {% csrf_token %}
    <div class="modal-body py-3">
        <div class="row g-4">
            
            <!-- Левая колонка: Основные данные -->
            <div class="col-md-6 border-end">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted text-uppercase">Название объекта</label>
                    <input type="text" name="name" class="form-control bg-light border-0 py-2" 
                           placeholder="Котельная установка КУ-5" required
                           hx-get="{% url 'check_object_name' %}"
                           hx-trigger="keyup changed delay:500ms"
                           hx-target="#name-check-container"
                           autocomplete="off">
                    <div id="name-check-container"></div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted text-uppercase">Инвентарный номер</label>
                    <input type="text" name="inventory_number" class="form-control bg-light border-0 py-2" placeholder="ИНВ-003429">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted text-uppercase">ID задачи в Youtrack</label>
                    <input type="text" name="youtrack_issue_id" class="form-control bg-light border-0 py-2" placeholder="Например: MNT-412">
                </div>
                
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted text-uppercase">Модель оборудования *</label>
                    <div id="search-wrapper-model" class="w-100 position-relative">
                        <input type="text" name="q" class="form-control bg-light border-0 shadow-none py-2 w-100" 
                               placeholder="Введите название модели для поиска..."
                               hx-get="{% url 'suggest' %}?field=model"
                               hx-trigger="keyup changed delay:300ms"
                               hx-target="#results-model"
                               autocomplete="off"
                               required>
                        <div id="results-model"></div>
                    </div>
                </div>
            </div>
            
            <!-- Правая колонка: Настройка планирования и Родитель -->
            <div class="col-md-6">
                <!-- Кастомный красивый переключатель режима ТО + поля -->
                {% include 'data/includes/scheduling_mode_fields.html' with mode='manual' %}

                <hr class="my-3 opacity-25">

                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted text-uppercase">Родительский объект (в состав чего входит)</label>
                    <div id="search-wrapper-parent" class="w-100 position-relative">
                        <input type="text" name="q" class="form-control bg-light border-0 shadow-none py-2 w-100" 
                               placeholder="Поиск родительского объекта..."
                               hx-get="{% url 'suggest' %}?field=parent"
                               hx-trigger="keyup changed delay:300ms"
                               hx-target="#results-parent"
                               autocomplete="off">
                        <div id="results-parent"></div>
                    </div>
                    <div class="form-text text-muted" style="font-size: 0.75rem;">Оставьте пустым, если это корневой агрегат.</div>
                </div>
            </div>

        </div>
    </div>
    <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Отмена</button>
        <button type="submit" class="btn btn-primary px-4 fw-bold">Создать</button>
    </div>
</form>
