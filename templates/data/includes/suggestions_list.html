<!-- templates/data/includes/suggestions_list.html -->
<div class="suggest-menu animate-fade">

    <!-- Для инлайн-смены родителя: явный пункт «сделать корневым» -->
    {% if field == 'parent_inline' and target_obj_uuid %}
    <button type="button"
            class="suggest-item text-danger fw-semibold"
            hx-post="{% url 'edit_parent' target_obj_uuid %}"
            hx-target="#parent-display-container"
            hx-swap="outerHTML"
            hx-vals='{"parent": ""}'>
        <i class="bi bi-x-circle-fill flex-shrink-0"></i>
        <span class="s-name">Без родителя (сделать корневым)</span>
    </button>
    <hr class="my-1 opacity-25">
    {% endif %}

    <!-- Создание нового значения прямо из подсказки (типы оборудования, правила ТО) -->
    {% if show_create_option %}
    <button type="button"
            class="suggest-item text-success fw-semibold"
            hx-get="{% url 'select_suggestion' %}?field={{ field }}&name={{ q|urlencode }}"
            hx-target="#search-wrapper-{{ field }}"
            hx-swap="outerHTML">
        <i class="bi bi-plus-circle-fill flex-shrink-0"></i>
        <span class="s-name text-truncate">Создать «{{ q }}»</span>
    </button>
    {% if results %}<hr class="my-1 opacity-25">{% endif %}
    {% endif %}

    {% for item in results %}
    <button type="button"
            class="suggest-item"
            {% if field == 'model_inline' and target_obj_uuid %}
                hx-post="{% url 'edit_object_model' target_obj_uuid %}"
                hx-target="#model-display-container"
                hx-swap="outerHTML"
                hx-vals='{"model": "{{ item.uuid }}"}'
            {% elif field == 'parent_inline' and target_obj_uuid %}
                hx-post="{% url 'edit_parent' target_obj_uuid %}"
                hx-target="#parent-display-container"
                hx-swap="outerHTML"
                hx-vals='{"parent": "{{ item.uuid }}"}'
            {% else %}
                hx-get="{% url 'select_suggestion' %}?field={{ field }}&uuid={{ item.uuid }}"
                hx-target="#search-wrapper-{{ field }}"
                hx-swap="outerHTML"
            {% endif %}>

        {% if field == 'model' or field == 'model_inline' %}
            <i class="bi bi-layers text-secondary flex-shrink-0"></i>
            <span class="s-name text-truncate">{{ item.name }}</span>
            <span class="s-sub text-truncate ms-auto">{{ item.object_type.type }}</span>
        {% elif field == 'parent' or field == 'parent_inline' or field == 'source_object' %}
            <i class="bi bi-box text-primary flex-shrink-0"></i>
            <span class="s-name text-truncate">{{ item.name|default:item.model.name }}</span>
            <span class="s-sub text-truncate ms-auto">{{ item.inventory_number|default:item.model.name }}</span>
        {% elif field == 'date_update_rule' %}
            <i class="bi bi-arrow-repeat text-success flex-shrink-0"></i>
            <span class="s-name text-truncate">{{ item.name }}</span>
        {% else %}
            <i class="bi bi-tag text-muted flex-shrink-0"></i>
            <span class="s-name text-truncate">{{ item.type }}</span>
        {% endif %}
    </button>
    {% empty %}
    {% if not show_create_option %}
    <div class="text-center text-muted py-3" style="font-size: 0.82rem;">
        <i class="bi bi-search d-block mb-1 opacity-50"></i>
        Ничего не найдено
    </div>
    {% endif %}
    {% endfor %}
</div>
