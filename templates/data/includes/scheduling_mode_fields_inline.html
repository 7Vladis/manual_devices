<!-- templates/data/includes/scheduling_mode_fields_inline.html -->
<div id="inline-scheduling-mode-fields" class="animate-fade">
    {% if mode == 'manual' %}
        <span class="hint">Правило расчёта будет отвязано, дата ТО задаётся вручную.</span>
    {% else %}
        <div class="field">
            <label>Выберите правило расчёта</label>
            <div id="search-wrapper-date_update_rule" class="w-100 position-relative">
                <input type="text" name="q" class="form-control"
                       placeholder="Начните вводить название правила..."
                       hx-get="{% url 'suggest' %}?field=date_update_rule"
                       hx-trigger="keyup changed delay:300ms, focus"
                       hx-target="#results-date_update_rule"
                       autocomplete="off">
                <div id="results-date_update_rule"></div>
            </div>
            <span class="hint">Новые правила создаются в разделе «Настройки → Правила ТО».</span>
        </div>
    {% endif %}
</div>
