<!-- templates/data/includes/rule_constructor_fields.html -->
<div class="animate-fade">
{% if strategy == 'fixed' %}
    {% include 'data/includes/rules_dates_builder.html' with dates=fixed_dates mode=mode %}
{% else %}
    <div class="field">
        <label>Точка отсчёта</label>
        <input type="hidden" name="new_rule_anchor" id="anchor-input-{{ mode }}" value="{{ anchor|default:'actual' }}">

        <div class="row g-2">
            <div class="col-12 col-sm-6">
                <button type="button" id="anchor-actual-{{ mode }}"
                        class="option-card w-100 text-start {% if anchor != 'scheduled' %}is-selected{% endif %}"
                        onclick="window.mdPickRuleAnchor('{{ mode }}', 'actual')">
                    <span class="option-icon bg-light-success text-success"><i class="bi bi-check-circle-fill"></i></span>
                    <span class="option-text">
                        <b>От факта</b>
                        <small>Срок считается от дня выполнения работ</small>
                    </span>
                </button>
            </div>
            <div class="col-12 col-sm-6">
                <button type="button" id="anchor-scheduled-{{ mode }}"
                        class="option-card w-100 text-start {% if anchor == 'scheduled' %}is-selected{% endif %}"
                        onclick="window.mdPickRuleAnchor('{{ mode }}', 'scheduled')">
                    <span class="option-icon bg-light-warning text-warning"><i class="bi bi-calendar-range"></i></span>
                    <span class="option-text">
                        <b>От плана</b>
                        <small>Жёсткий график: темп не сдвигается</small>
                    </span>
                </button>
            </div>
        </div>
    </div>

    <div class="field">
        <label>Интервал до следующего ТО</label>
        <div class="row g-2">
            <div class="col-4">
                <div class="input-group">
                    <input type="number" name="new_rule_years" class="form-control text-center fw-semibold"
                           value="{{ years|default:0 }}" min="0" max="100" aria-label="Лет">
                    <span class="input-group-text">лет</span>
                </div>
            </div>
            <div class="col-4">
                <div class="input-group">
                    <input type="number" name="new_rule_months" class="form-control text-center fw-semibold"
                           value="{{ months|default:6 }}" min="0" max="1200" aria-label="Месяцев">
                    <span class="input-group-text">мес.</span>
                </div>
            </div>
            <div class="col-4">
                <div class="input-group">
                    <input type="number" name="new_rule_days" class="form-control text-center fw-semibold"
                           value="{{ days|default:0 }}" min="0" max="36500" aria-label="Дней">
                    <span class="input-group-text">дн.</span>
                </div>
            </div>
        </div>
        <span class="hint">Хотя бы одно поле должно быть больше нуля.</span>
    </div>
{% endif %}
</div>
