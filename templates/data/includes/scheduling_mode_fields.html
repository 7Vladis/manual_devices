<!-- templates/data/includes/scheduling_mode_fields.html -->
<div id="scheduling-mode-container" class="animate-fade">

    <input type="hidden" name="maintenance_scheduling_mode" value="{{ mode|default:'manual' }}">

    <div class="field">
        <label>Как определять дату следующего ТО</label>
        <div class="row g-2">
            <div class="col-12 col-sm-6">
                <button type="button"
                        class="option-card w-100 text-start {% if mode != 'auto' %}is-selected{% endif %}"
                        hx-get="{% url 'toggle_scheduling_mode' %}?maintenance_scheduling_mode=manual"
                        hx-target="#scheduling-mode-container"
                        hx-swap="outerHTML">
                    <span class="option-icon bg-light-primary text-primary"><i class="bi bi-calendar-event"></i></span>
                    <span class="option-text">
                        <b>Вручную</b>
                        <small>Конкретная дата из календаря</small>
                    </span>
                </button>
            </div>
            <div class="col-12 col-sm-6">
                <button type="button"
                        class="option-card w-100 text-start {% if mode == 'auto' %}is-selected{% endif %}"
                        hx-get="{% url 'toggle_scheduling_mode' %}?maintenance_scheduling_mode=auto"
                        hx-target="#scheduling-mode-container"
                        hx-swap="outerHTML">
                    <span class="option-icon bg-light-success text-success"><i class="bi bi-arrow-repeat"></i></span>
                    <span class="option-text">
                        <b>По правилу</b>
                        <small>Автоматический пересчёт срока</small>
                    </span>
                </button>
            </div>
        </div>
    </div>

    {% if mode == 'auto' %}
        <div class="field animate-fade">
            <label>Правило расчёта<span class="req">*</span></label>
            <div id="search-wrapper-date_update_rule" class="w-100 position-relative">
                <input type="text" name="q" class="form-control"
                       placeholder="Например: Раз в полгода"
                       hx-get="{% url 'suggest' %}?field=date_update_rule"
                       hx-trigger="keyup changed delay:300ms, focus"
                       hx-target="#results-date_update_rule"
                       autocomplete="off"
                       required>
                <div id="results-date_update_rule"></div>
            </div>
            <span class="hint text-success">
                <i class="bi bi-info-circle-fill me-1"></i>Первая дата ТО будет рассчитана от сегодняшнего дня.
            </span>
        </div>
    {% else %}
        <div class="field animate-fade">
            <label>Дата следующего ТО</label>
            <input type="date" name="next_maintenance_date" class="form-control">
            <span class="hint">Можно оставить пустым и назначить срок позже.</span>
        </div>
    {% endif %}

</div>
