<!-- templates/data/includes/suggestion_input.html -->
{% comment %}
Поле поиска с подсказками. Сброс выбранного родителя пересчитывает проверку
имени: область сравнения — дерево, и без родителя она другая.
{% endcomment %}
<div id="search-wrapper-{{ field }}" class="w-100 position-relative"
     {% if field == 'parent' %}hx-on::load="htmx.trigger(document.body, 'checkObjectName')"{% endif %}>
    <input type="text"
           name="q"
           class="form-control"
           placeholder="{{ placeholder }}"
           hx-get="{% url 'suggest' %}?field={{ field }}"
           hx-trigger="keyup changed delay:300ms, focus"
           hx-target="#results-{{ field }}"
           autocomplete="off"
           autofocus>
    <div id="results-{{ field }}"></div>
</div>
