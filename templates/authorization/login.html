{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body { height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f1f5f9; }
        .login-card { width: 100%; max-width: 400px; border: none; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .brand-logo { color: #1e293b; font-weight: 800; font-size: 1.5rem; }
    </style>
</head>
<body>
    <div class="card login-card p-4">
        <div class="text-center mb-4">
            <div class="brand-logo mb-2">MANUAL DEVICES</div>
            <p class="text-muted small">Войдите, чтобы продолжить работу</p>
        </div>

        <form method="post">
            {% csrf_token %}
            
            {% if form.non_field_errors %}
            <div class="alert alert-danger py-2 small">
                {% for error in form.non_field_errors %}{{ error }}{% endfor %}
            </div>
            {% endif %}

            <div class="mb-3">
                <label class="form-label small fw-bold">Email</label>
                {{ form.username }}
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Пароль</label>
                {{ form.password }}
            </div>

            <div class="form-check mb-4">
                {{ form.remember_me }}
                <label class="form-check-label small text-muted" for="{{ form.remember_me.id_for_label }}">
                    Запомнить меня на этом устройстве
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" style="background-color: #1e293b; border: none;">
                Войти в систему
            </button>
        </form>
    </div>
</body>
</html>
