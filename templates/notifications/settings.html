{% extends 'base.html' %}
{% block content %}
<div class="container mt-4" style="max-width: 1100px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold"><i class="bi bi-bell-fill me-2 text-primary"></i>Настройка уведомлений</h4>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary btn-sm px-3">
            <i class="bi bi-arrow-left"></i> Назад
        </a>
    </div>

    <form id="webhook-management-form">
        {% csrf_token %}
        <div id="webhook-list-container">
            {% include 'notifications/includes/webhook_list.html' %}
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4 px-1">
            <button type="button" class="btn btn-outline-danger px-4" 
                    hx-post="{% url 'delete_webhooks' %}" 
                    hx-target="#webhook-list-container"
                    hx-confirm="Удалить выбранные вебхуки?">
                <i class="bi bi-trash"></i> Удалить
            </button>

            <button type="button" class="btn btn-primary px-4 fw-bold" data-bs-toggle="modal" data-bs-target="#addWebhookModal">
                <i class="bi bi-plus-lg me-1"></i> Добавить
            </button>
        </div>
    </form>
</div>

<!-- Модальное окно добавления -->
<div class="modal fade" id="addWebhookModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Новый вебхук</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form hx-post="{% url 'add_webhook' %}" 
                  hx-target="#webhook-list-container" 
                  hx-on::after-request="bootstrap.Modal.getInstance(document.getElementById('addWebhookModal')).hide(); this.reset();">
                {% csrf_token %}
                <div class="modal-body py-4">
                    <label class="form-label small fw-bold text-muted">URL ВЕБХУКА MATTERMOST</label>
                    <input type="url" name="webhook_url" class="form-control form-control-lg bg-light border-0" 
                           placeholder="https://mattermost.example.com/hooks/..." required>
                    <div class="form-text mt-2">Скопируйте URL из настроек интеграции Mattermost.</div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light" data-bs-target="modal" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary px-4">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
