{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ManDev{% endblock %}</title>

    <!-- Favicon: гаечный ключ -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%231a2026'><path d='M0 1l1-1 3.081 2.2a1 1 0 0 1 .419.815v.07a1 1 0 0 0 .293.708L10.5 9.5l.914-.305a1 1 0 0 1 1.023.242l3.356 3.356a1 1 0 0 1 0 1.414l-1.586 1.586a1 1 0 0 1-1.414 0l-3.356-3.356a1 1 0 0 1-.242-1.023L9.5 10.5 3.793 4.793a1 1 0 0 0-.707-.293h-.071a1 1 0 0 1-.814-.419L0 1zm11.354 9.146a.5.5 0 0 0-.708.708l3 3a.5.5 0 0 0 .708-.708l-3-3z'/><path d='M15.898 2.223a3.003 3.003 0 0 1-3.679 3.674L5.878 12.15a3 3 0 1 1-2.026-2.027l6.252-6.341A3 3 0 0 1 13.778.1l-2.142 2.142L12 4l1.757.364 2.141-2.141zm-13.37 9.019L3.001 11l.471.242.529.026.287.445.445.287.026.529L5 13l-.242.471-.026.529-.445.287-.287.445-.529.026L3 15l-.471-.242L2 14.732l-.287-.445L1.268 14l-.026-.529L1 13l.242-.471.026-.529.445-.287.287-.445.528-.026z'/></svg>">

    <!-- Golos Text: интерфейсный шрифт с родной кириллицей -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Единая дизайн-система -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Глобальный верхний прогресс-бар загрузки для HTMX -->
    <div id="global-progress-bar"></div>

    <!-- Стек уведомлений (результаты обращений к YouTrack и прочие фоновые события) -->
    <div id="toast-stack" aria-live="polite"></div>

    <!-- Шапка приложения -->
    {% include 'includes/header.html' %}

    <!-- Главная рабочая область -->
    <main class="flex-grow-1 d-flex flex-column" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Глобальное модальное окно: YouTrack Token -->
    <div class="modal fade" id="userTokenModal" tabindex="-1" aria-hidden="true" data-md-reset>
        <div class="modal-dialog modal-dialog-centered" style="max-width: 520px;">
            <div class="modal-content overflow-hidden" id="user-token-modal-content">
                <!-- Контент подгружается по HTMX -->
            </div>
        </div>
    </div>

    <!-- Интеграция HTMX CSRF и глобальный индикатор -->
    <script>
        /**
         * Форма комментария принимает текст ИЛИ файл (либо и то, и другое).
         * Кнопка отправки остаётся заблокированной, пока не заполнено хотя бы одно поле.
         * Функция объявлена глобально, так как форма пересоздаётся при каждом HTMX-свопе.
         */
        window.mdSyncCommentForm = function (el) {
            const form = el.closest('form');
            if (!form) return;
            const textInput = form.querySelector('textarea[name="text"]');
            const fileInput = form.querySelector('input[type="file"]');
            const submitBtn = form.querySelector('[type="submit"]');
            if (!submitBtn) return;

            const hasText = !!(textInput && textInput.value.trim());
            const hasFile = !!(fileInput && fileInput.files && fileInput.files.length);
            submitBtn.disabled = !(hasText || hasFile);
        };

        /**
         * Показывает ошибку валидации внутри формы (блок .form-feedback).
         * Используется, когда значение выбирается из HTMX-подсказок и обычная
         * браузерная валидация required не может проверить факт выбора.
         */
        window.mdShowFormError = function (form, message) {
            const box = form.querySelector('.form-feedback');
            if (!box) { alert(message); return; }
            box.innerHTML =
                '<div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 mb-3 rounded-3 small animate-fade">' +
                '<i class="bi bi-exclamation-circle-fill fs-5"></i><div></div></div>';
            box.querySelector('div > div').textContent = message;
            box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        };

        /**
         * htmx по умолчанию игнорирует тело ответов 4xx. Сервер отдаёт на них
         * готовые фрагменты с текстом ошибки (и при необходимости HX-Retarget),
         * поэтому для «ожидаемых» кодов разрешаем своп.
         */
        document.body.addEventListener('htmx:beforeSwap', (event) => {
            const status = event.detail.xhr.status;
            if ([400, 403, 409, 422].includes(status)) {
                event.detail.shouldSwap = true;
                event.detail.isError = false;
            }
        });

        // Уведомления в стеке живут 8 секунд, затем исчезают сами.
        new MutationObserver((mutations) => {
            mutations.forEach((m) => m.addedNodes.forEach((node) => {
                if (node.nodeType === 1 && node.classList.contains('toast-item')) {
                    setTimeout(() => {
                        node.classList.add('is-leaving');
                        setTimeout(() => node.remove(), 250);
                    }, 8000);
                }
            }));
        }).observe(document.getElementById('toast-stack'), { childList: true });

        /**
         * Справочник на узком экране работает как «список → карточка».
         * Загрузка содержимого в #detail-container показывает карточку,
         * кнопка возврата — снова список. На широких экранах класс
         * ни на что не влияет: обе панели видны всегда.
         */
        window.mdShowDictList = function () {
            const layout = document.getElementById('dict-layout');
            if (layout) layout.classList.remove('show-detail');
        };

        document.body.addEventListener('htmx:afterSwap', (event) => {
            const layout = document.getElementById('dict-layout');
            const detail = document.getElementById('detail-container');
            if (!layout || !detail) return;
            if (detail === event.target || detail.contains(event.target)) {
                layout.classList.add('show-detail');
            }
        });

        /**
         * Выбор стратегии и точки отсчёта в конструкторе правил ТО.
         * Значение хранится в скрытом поле, а плитки показывают выбор —
         * так же, как в окне создания объекта.
         */
        window.mdPickRuleStrategy = function (mode, value) {
            const input = document.getElementById('strategy-input-' + mode);
            if (input) input.value = value;
            ['relative', 'fixed'].forEach((name) => {
                const card = document.getElementById('strategy-' + name + '-' + mode);
                if (card) card.classList.toggle('is-selected', name === value);
            });
        };

        window.mdPickRuleAnchor = function (mode, value) {
            const input = document.getElementById('anchor-input-' + mode);
            if (input) input.value = value;
            ['actual', 'scheduled'].forEach((name) => {
                const card = document.getElementById('anchor-' + name + '-' + mode);
                if (card) card.classList.toggle('is-selected', name === value);
            });
        };

        /**
         * Раскрытые ветки дерева справочника.
         *
         * Дерево пересобирает сервер целиком, и он не знает, что человек успел
         * открыть, — поэтому формы создания и копирования объекта отправляют
         * этот список вместе с данными. Иначе после добавления объекта
         * схлопывались все ветки, и путь к рабочему узлу приходилось
         * открывать заново.
         */
        window.mdOpenTreeNodes = function () {
            return Array.from(document.querySelectorAll('.tree-item > .collapse.show'))
                .map((el) => el.id.replace('children-', ''))
                .filter(Boolean)
                .join(',');
        };

        /**
         * Ширина списка в справочнике: тянут мышью, помнит браузер.
         *
         * Ширина живёт в переменной `--dict-sidebar-w` на самом размётчике,
         * поэтому её достаточно переписать — перерисовывать ничего не нужно,
         * и подстановки HTMX в панели её не теряют.
         *
         * Запоминает только браузер: это удобство одного человека за одним
         * экраном, в базе ему делать нечего. `localStorage` может бросить
         * исключение в приватном окне и при запрещённых данных сайта, поэтому
         * и чтение, и запись обёрнуты — без него всё работает, просто ширина
         * не переживёт перезагрузку.
         */
        const MD_DICT_W_KEY = 'mdDictSidebarWidth';
        // Ниже 180 список перестаёт быть списком: от названий остаются
        // три буквы с многоточием. Выше 680 он отнимает место у карточки.
        const MD_DICT_W_MIN = 180;

        const mdDictMaxWidth = () => Math.max(MD_DICT_W_MIN, Math.min(680, window.innerWidth - 420));

        const mdSetDictWidth = (layout, width, remember) => {
            const value = Math.round(Math.min(Math.max(width, MD_DICT_W_MIN), mdDictMaxWidth()));
            layout.style.setProperty('--dict-sidebar-w', value + 'px');
            if (remember) {
                try { localStorage.setItem(MD_DICT_W_KEY, String(value)); } catch (e) { /* не запомним */ }
            }
            return value;
        };

        const mdResetDictWidth = (layout) => {
            layout.style.removeProperty('--dict-sidebar-w');
            try { localStorage.removeItem(MD_DICT_W_KEY); } catch (e) { /* не забудем */ }
        };

        window.mdInitDictResizer = function () {
            const layout = document.getElementById('dict-layout');
            const handle = document.getElementById('dict-resizer');
            const pane = layout && layout.querySelector('.dict-pane-list');
            if (!layout || !handle || !pane || handle.dataset.mdReady) return;
            handle.dataset.mdReady = '1';

            let saved = null;
            try { saved = localStorage.getItem(MD_DICT_W_KEY); } catch (e) { /* нечего вспомнить */ }
            if (saved && Number(saved) > 0) mdSetDictWidth(layout, Number(saved), false);

            let startX = 0;
            let startWidth = 0;

            handle.addEventListener('pointerdown', (event) => {
                startX = event.clientX;
                startWidth = pane.getBoundingClientRect().width;
                layout.classList.add('is-resizing');
                handle.setPointerCapture(event.pointerId);
                event.preventDefault();
            });

            handle.addEventListener('pointermove', (event) => {
                if (!layout.classList.contains('is-resizing')) return;
                mdSetDictWidth(layout, startWidth + (event.clientX - startX), false);
            });

            const finish = (event) => {
                if (!layout.classList.contains('is-resizing')) return;
                layout.classList.remove('is-resizing');
                if (event && event.pointerId !== undefined && handle.hasPointerCapture(event.pointerId)) {
                    handle.releasePointerCapture(event.pointerId);
                }
                mdSetDictWidth(layout, pane.getBoundingClientRect().width, true);
            };
            handle.addEventListener('pointerup', finish);
            handle.addEventListener('pointercancel', finish);

            // Двойной щелчок возвращает ширину по умолчанию — её же вернёт Home.
            handle.addEventListener('dblclick', () => mdResetDictWidth(layout));

            handle.addEventListener('keydown', (event) => {
                const step = event.shiftKey ? 48 : 16;
                const current = pane.getBoundingClientRect().width;
                if (event.key === 'ArrowLeft') mdSetDictWidth(layout, current - step, true);
                else if (event.key === 'ArrowRight') mdSetDictWidth(layout, current + step, true);
                else if (event.key === 'Home') mdResetDictWidth(layout);
                else return;
                event.preventDefault();
            });

            // Окно сузили — ширина могла стать больше допустимой.
            window.addEventListener('resize', () => {
                if (!layout.style.getPropertyValue('--dict-sidebar-w')) return;
                mdSetDictWidth(layout, pane.getBoundingClientRect().width, false);
            });
        };

        document.addEventListener('DOMContentLoaded', window.mdInitDictResizer);

        /**
         * Выбор работы в окне фиксации ТО.
         *
         * У каждого плана свой интервал, поэтому и предложенный срок свой:
         * он лежит в `data-next-date` выбранного пункта. Без переноса в поле
         * человек закрывал бы один план датой, посчитанной для другого.
         */
        window.mdPickServicePlan = function (select) {
            const option = select.options[select.selectedIndex];
            if (!option) return;
            const field = document.getElementById('maintenance-date-input');
            const date = option.getAttribute('data-next-date');
            if (field && date) field.value = date;
            const hint = document.getElementById('service-date-hint');
            if (hint) {
                hint.innerHTML = '<i class="bi bi-magic me-1"></i>Рассчитана по правилу «'
                    + (option.getAttribute('data-rule') || '') + '».';
            }
        };

        /**
         * Копирование значения в буфер обмена.
         *
         * Что копировать, кнопка несёт в `data-md-copy` — либо, если значение
         * правится на месте, в `data-md-copy-from`: селектор элемента, из
         * которого значение читается в момент щелчка. Второй способ нужен
         * кнопке в подписи ячейки: подпись при правке не перерисовывается, и
         * записанное в атрибут значение осталось бы прежним. Разметку
         * значения помечает `data-md-value` — рядом с ним в ячейке стоят
         * карандаш правки и «не указан», и копировать их не надо.
         *
         * `navigator.clipboard` существует только в защищённом контексте:
         * по https и на localhost. Сервис внутренний, его открывают и по
         * http по адресу машины — там объекта просто нет, поэтому для таких
         * случаев остаётся запасной путь через скрытое поле и
         * `document.execCommand`. Он устаревший, но работает везде.
         */
        window.mdCopy = function (button) {
            const from = button.getAttribute('data-md-copy-from');
            const source = from ? document.querySelector(from) : null;
            const text = (from ? (source ? source.textContent : '') : button.getAttribute('data-md-copy')) || '';
            if (!text.trim()) return;

            const done = () => {
                const icon = button.querySelector('i');
                if (!icon || button.classList.contains('is-copied')) return;
                const was = icon.className;
                button.classList.add('is-copied');
                icon.className = 'bi bi-clipboard-check';
                setTimeout(() => {
                    icon.className = was;
                    button.classList.remove('is-copied');
                }, 1200);
            };

            const fallback = () => {
                const field = document.createElement('textarea');
                field.value = text.trim();
                field.setAttribute('readonly', '');
                field.style.position = 'fixed';
                field.style.opacity = '0';
                document.body.appendChild(field);
                field.select();
                try { document.execCommand('copy'); done(); } catch (e) { /* копировать нечем */ }
                document.body.removeChild(field);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text.trim()).then(done).catch(fallback);
            } else {
                fallback();
            }
        };

        /**
         * Подсказки закрываются по щелчку мимо них и по Escape.
         *
         * Раньше список висел до выбора значения и перекрывал поля формы под
         * собой. Щелчки внутри поля не трогаем: там выбор пункта, и убирать
         * список до того, как HTMX отправит запрос, нельзя. Список результатов
         * поиска (`suggest-menu-static`) — не подсказка, а содержимое страницы.
         */
        const mdCloseSuggestions = (event) => {
            document.querySelectorAll('.suggest-menu:not(.suggest-menu-static)').forEach((menu) => {
                const wrapper = menu.closest('[id^="search-wrapper-"]');
                if (!wrapper || !event || !wrapper.contains(event.target)) menu.remove();
            });
        };

        document.addEventListener('click', mdCloseSuggestions);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') mdCloseSuggestions(null);
        });

        /**
         * Содержимое модальных окон, подгружаемое по HTMX, очищается при закрытии.
         *
         * Иначе в DOM одновременно живут несколько загруженных окон с одинаковыми
         * id (например, окна создания и редактирования правила ТО используют один
         * контейнер полей), и HTMX подставляет ответ в первое совпадение — то есть
         * в скрытое окно. Снаружи это выглядит как «кнопка ничего не делает».
         */
        document.addEventListener('hidden.bs.modal', (event) => {
            const modal = event.target;

            // Закрытое окно не должно продолжать играть: само по себе видео
            // не останавливается, и звук идёт из невидимого проигрывателя.
            modal.querySelectorAll('video').forEach((player) => { player.pause(); });

            if (modal.hasAttribute('data-md-reset')) {
                const holder = modal.querySelector('.modal-content');
                if (holder) holder.innerHTML = '';
                return;
            }

            // Окна со статичной разметкой: сбрасываем введённое и ошибки,
            // чтобы при повторном открытии форма была чистой.
            modal.querySelectorAll('form').forEach((form) => {
                form.reset();
                form.querySelectorAll('.form-feedback').forEach((box) => { box.innerHTML = ''; });
            });
        });

        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });

        document.body.addEventListener('htmx:beforeRequest', () => {
            const bar = document.getElementById('global-progress-bar');
            if (bar) {
                bar.style.opacity = '1';
                bar.style.width = '70%';
            }
        });
        document.body.addEventListener('htmx:afterRequest', () => {
            const bar = document.getElementById('global-progress-bar');
            if (bar) {
                bar.style.width = '100%';
                setTimeout(() => {
                    bar.style.opacity = '0';
                    setTimeout(() => { bar.style.width = '0%'; }, 200);
                }, 150);
            }
        });

        document.addEventListener('click', function(event) {
            const searchBox = document.querySelector('.header-search');
            const searchResults = document.getElementById('search-results');
            if (searchResults && searchBox && !searchBox.contains(event.target)) {
                searchResults.innerHTML = '';
            }
        });

        document.addEventListener('click', function(event) {
            // Закрытие поиска шапки
            const searchBox = document.querySelector('.header-search');
            const searchResults = document.getElementById('search-results');
            if (searchResults && searchBox && !searchBox.contains(event.target)) {
                searchResults.innerHTML = '';
            }

            // Закрытие активных инлайн-форм при клике вне их контейнера
            document.querySelectorAll('.inline-edit-wrapper').forEach(wrapper => {
                if (!wrapper.contains(event.target)) {
                    const cancelBtn = wrapper.querySelector('[title*="Отмена"]');
                    if (cancelBtn) {
                        cancelBtn.click();
                    }
                }
            });
        });
    </script>
</body>
</html>
