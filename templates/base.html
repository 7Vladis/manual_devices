<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ManDev{% endblock %}</title>

    <!-- Favicon (Шестеренка) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%232563eb'><path d='M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z'/><path d='M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319z'/></svg>">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Единая дизайн-система -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Глобальный верхний прогресс-бар загрузки для HTMX -->
    <div id="global-progress-bar"></div>

    <!-- Шапка приложения -->
    {% include 'includes/header.html' %}

    <!-- Главная рабочая область -->
    <main class="flex-grow-1 d-flex flex-column" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Глобальное модальное окно: Экспорт XLSX -->
    {% if request.user.is_admin_or_higher %}
    <div class="modal fade" id="exportModal" tabindex="-1" aria-labelledby="exportModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" style="max-width: 480px;">
            <div class="modal-content border-0 shadow-lg rounded-3">
                <div class="modal-header bg-dark text-white py-3 px-4">
                    <h6 class="modal-title fw-bold m-0" id="exportModalLabel">
                        <i class="bi bi-file-earmark-excel-fill text-success me-2 fs-5"></i> Экспорт данных в XLSX
                    </h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <form action="{% url 'export_xlsx' %}" method="get">
                    <div class="modal-body p-4 text-start">
                        <p class="text-secondary small mb-3">
                            Выберите режим выгрузки данных оборудования. Файл формируется в формате Microsoft Excel (.xlsx).
                        </p>
                        <div class="p-3 bg-light rounded-3 border">
                            <div class="form-check mb-2.5">
                                <input class="form-check-input" type="radio" name="export_mode" id="modeAll" value="all" checked>
                                <label class="form-check-label small fw-semibold text-dark" for="modeAll" style="cursor: pointer;">
                                    Все объекты системы (включая без инв. №)
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="export_mode" id="modeWithInv" value="with_inventory">
                                <label class="form-check-label small fw-semibold text-dark" for="modeWithInv" style="cursor: pointer;">
                                    Только с заполненным инвентарным номером
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light px-4 py-2.5 border-top">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Отмена</button>
                        <button type="submit" class="btn btn-success px-3 fw-bold" onclick="bootstrap.Modal.getInstance(document.getElementById('exportModal')).hide();">
                            <i class="bi bi-download me-1"></i> Скачать XLSX
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    {% endif %}

    <!-- Глобальное модальное окно: YouTrack Token -->
    <div class="modal fade" id="userTokenModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" style="max-width: 480px;">
            <div class="modal-content border-0 shadow-lg rounded-3" id="user-token-modal-content">
                <!-- Контент подгружается по HTMX -->
            </div>
        </div>
    </div>

    <!-- Интеграция HTMX CSRF и глобальный индикатор -->
    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });

        document.body.addEventListener('htmx:beforeRequest', () => {
            const bar = document.getElementById('global-progress-bar');
            if (bar) {
                bar.style.opacity = '1';
                bar.style.width = '70%';
            }
        });
        document.body.addEventListener('htmx:afterRequest', () => {
            const bar = document.getElementById('global-progress-bar');
            if (bar) {
                bar.style.width = '100%';
                setTimeout(() => {
                    bar.style.opacity = '0';
                    setTimeout(() => { bar.style.width = '0%'; }, 200);
                }, 150);
            }
        });

        document.addEventListener('click', function(event) {
            const searchBox = document.querySelector('.header-search');
            const searchResults = document.getElementById('search-results');
            if (searchResults && searchBox && !searchBox.contains(event.target)) {
                searchResults.innerHTML = '';
            }
        });

        document.addEventListener('click', function(event) {
            // Закрытие поиска шапки
            const searchBox = document.querySelector('.header-search');
            const searchResults = document.getElementById('search-results');
            if (searchResults && searchBox && !searchBox.contains(event.target)) {
                searchResults.innerHTML = '';
            }

            // Закрытие активных инлайн-форм при клике вне их контейнера
            document.querySelectorAll('.inline-edit-wrapper').forEach(wrapper => {
                if (!wrapper.contains(event.target)) {
                    const cancelBtn = wrapper.querySelector('[title*="Отмена"]');
                    if (cancelBtn) {
                        cancelBtn.click();
                    }
                }
            });
        });
    </script>
</body>
</html>
