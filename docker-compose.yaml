services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    user: "1000:1000"
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        (python manage.py shell -c "import os; from django.contrib.auth import get_user_model; exit(0 if get_user_model().objects.filter(email=os.getenv('DJANGO_SUPERUSER_EMAIL')).exists() else 1)" || python manage.py createsuperuser --noinput) &&
        gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -
    volumes:
      # Каталог проекта смонтирован целиком, поэтому вложения (./media)
      # остаются на хосте: именно их переносит update.sh между релизами.
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Периодические задачи живут в отдельном процессе: один контейнер —
  # ровно один планировщик, независимо от числа web-воркеров.
  scheduler:
    build: .
    user: "1000:1000"
    command: python manage.py run_scheduler
    volumes:
      # Каталог проекта смонтирован целиком, поэтому вложения (./media)
      # остаются на хосте: именно их переносит update.sh между релизами.
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
