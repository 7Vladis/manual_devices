version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5  

  web:
    build: .
    user: "1000:1000"
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        (python manage.py shell -c "import os; from django.contrib.auth import get_user_model; exit(0 if get_user_model().objects.filter(email=os.getenv('DJANGO_SUPERUSER_EMAIL')).exists() else 1)" || python manage.py createsuperuser --noinput) &&
        python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - ./ldap_cert.crt:/app/ldap_cert.crt:ro
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
